<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAEPVision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <a class="brand" href="/" aria-label="SAEPVision - início">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 7.5h3l1.2-2h7.6l1.2 2h3A1.5 1.5 0 0 1 21.5 9v9a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          <span class="brand__copy">
            <strong>SAEPVision</strong>
            <small>Fotografia em foco</small>
          </span>
        </a>
        <div id="userBadge" class="user-badge hidden">
          <img id="profileAvatar" src="/images/usuario1.jpg" alt="Perfil" class="avatar" />
          <span id="userName">SAEPVision</span>
        </div>
      </div>

      <div class="topbar__actions">
        <button id="openLoginBtn" class="btn btn--primary hidden">Login</button>
        <button id="openProfileBtn" class="btn btn--secondary hidden">Ver Perfil</button>
        <button id="closeMenuBtn" class="btn btn--icon" aria-label="Fechar menu">×</button>
      </div>
    </header>

    <main id="mainLayout" class="main-layout">
      <aside id="profilePanel" class="profile-panel hidden">
        <div class="profile-panel__header">
          <img id="panelAvatar" src="/images/fotografo1.jpg" alt="Foto do fotógrafo" class="avatar avatar--large" />
          <div>
            <h3 id="panelName">Fotógrafo</h3>
            <p id="panelIdentifier">@fotografo</p>
          </div>
        </div>
        <div class="profile-panel__stats">
          <div><strong id="panelLikes">0</strong><span>Curtidas</span></div>
          <div><strong id="panelPosts">0</strong><span>Publicações</span></div>
        </div>
        <div class="profile-panel__buttons">
          <button id="myPostsBtn" class="btn btn--primary">Suas publicações</button>
          <button id="logoutBtn" class="btn btn--danger">Logout</button>
        </div>
      </aside>

      <section class="content">
        <div class="search-bar">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="text" placeholder="Digite o nome do fotógrafo… ex: @fotografo1" />
        </div>

        <div class="toolbar">
          <button id="newPhotoBtn" class="btn btn--primary hidden">Cadastrar fotografia</button>
        </div>

        <div id="messageBox" class="message-box hidden"></div>

        <div id="gallery" class="gallery"></div>
      </section>
    </main>

    <footer class="footer">
      <div>
        <strong>SAEPVision</strong>
        <p>Compartilhando imagens e histórias.</p>
      </div>
      <div class="socials">
        <a href="#" aria-label="Instagram">Instagram</a>
        <a href="#" aria-label="Facebook">Facebook</a>
        <a href="#" aria-label="X">X</a>
      </div>
    </footer>
  </div>

  <div id="loginModal" class="modal hidden">
    <div class="modal__backdrop" data-close="true"></div>
    <div class="modal__content">
      <button id="closeLoginBtn" class="modal__close" aria-label="Fechar">×</button>
      <h2>Login</h2>
      <form id="loginForm">
        <label>
          <span>E-mail</span>
          <input type="email" id="loginEmail" name="email" required />
        </label>
        <label>
          <span>Senha</span>
          <input type="password" id="loginSenha" name="senha" required />
        </label>
        <button type="submit" class="btn btn--primary btn--full">Entrar</button>
      </form>
    </div>
  </div>

  <div id="photoModal" class="modal hidden">
    <div class="modal__backdrop" data-close="true"></div>
    <div class="modal__content modal__content--wide">
      <button id="closePhotoModalBtn" class="modal__close" aria-label="Fechar">×</button>
      <h2>Cadastrar fotografia</h2>
      <form id="photoForm" enctype="multipart/form-data">
        <div class="form-grid">
          <label>
            <span>Título da imagem</span>
            <input type="text" id="photoTitle" name="titulo" required />
          </label>
          <label>
            <span>Local</span>
            <input type="text" id="photoLocal" name="local" required />
          </label>
        </div>

        <label class="upload-field">
          <span>Imagem</span>
          <input type="file" id="photoFile" name="imagem" accept=".jpg,.jpeg,.png,.gif,.webp" required />
          <small id="fileNameText">Nenhum arquivo escolhido</small>
        </label>

        <button type="submit" class="btn btn--primary btn--full">Salvar publicação</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
